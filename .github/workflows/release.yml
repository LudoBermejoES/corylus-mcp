name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: corylus-mcp-windows-x86_64.exe, bin: corylus-mcp.exe }
          - { os: macos-latest,   target: aarch64-apple-darwin,   asset: corylus-mcp-darwin-aarch64,    bin: corylus-mcp }
          - { os: macos-latest,   target: x86_64-apple-darwin,    asset: corylus-mcp-darwin-x86_64,     bin: corylus-mcp }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, asset: corylus-mcp-linux-x86_64,   bin: corylus-mcp }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --manifest-path bridge/Cargo.toml
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --manifest-path bridge/Cargo.toml --target ${{ matrix.target }}
      - shell: bash
        run: cp "bridge/target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum corylus-mcp-* > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Bridge binaries for Corylus's MCP module. Verify with SHA256SUMS."
